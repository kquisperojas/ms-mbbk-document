services:
  postgres:
    image: postgres:16-alpine
    container_name: mbbk-document-db
    environment:
      POSTGRES_DB: bd_document
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - mbbk-document-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d bd_document"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mbbk-document-data:
