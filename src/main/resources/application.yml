server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ms-mbbk-document
  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 150MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bd_document}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        max-page-size: 100
        serialization-mode: via-dto

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:8788,http://localhost:8788,http://127.0.0.1:4200,http://localhost:4200}
  docs-root: ${DOCS_ROOT:C:\\WORKSPACE\\DOCUMENTACION}
  engine-dir: ${DOCUMENTATION_ENGINE:${user.dir}/documentation-engine}
  node-bin: ${NODE_BIN:node}
  archify-bin: ${ARCHIFY_BIN:${user.home}/.agents/skills/archify/bin/archify.mjs}
  canonical-report: ${CANONICAL_REPORT:C:\\WORKSPACE\\DOCUMENTACION\\NEG-1678\\informe-NEG-1678.html}
  github-org: ${GITHUB_ORG:pichincha-peru}
  jira:
    base-url: ${JIRA_BASE_URL:https://pichinchaperu.atlassian.net}
    email: ${JIRA_EMAIL:}
    api-token: ${JIRA_API_TOKEN:}
    project: ${JIRA_PROJECT:APP}
    board-id: ${JIRA_BOARD_ID:179}
    status: ${JIRA_STATUS:Solucionado}
    issue-types: ${JIRA_ISSUE_TYPES:Epic}
    jql: ${JIRA_JQL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
